<body>
<h1>🎓 AIR1 Village Player</h1>
<div class="sub">Free • Offline • हर भाषा में • Teacher credit 100%</div>

<div class="card" id="loader">
  <div class="stage-tag">Step 1 — Load District Pack</div>
  <p style="font-size:.85rem;color:var(--mut)">Pack file chuno (district_pack .json) — internet ki zarurat nahi.</p>
  <input type="file" id="packfile" accept=".json">
</div>

<div class="card hidden" id="lesson"></div>
<div class="card hidden" id="quiz"></div>
<div class="card hidden" id="attrib"></div>

<script>
let PACK = null;
document.getElementById('packfile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      PACK = JSON.parse(r.result);
      render();
    } catch(err) { alert('Pack kharab hai: ' + err.message); }
  };
  r.readAsText(f);
});

function esc(s){ const d=document.createElement('div'); d.textContent=String(s??''); return d.innerHTML; }

function render(){
  document.getElementById('loader').classList.add('hidden');
  const d = PACK.district || {};
  const a = PACK.attribution || {};
  const st = PACK.stages || {};

  // Lesson card
  const L = document.getElementById('lesson'); L.classList.remove('hidden');
  let qaHtml = '';
  (st.qa_units || []).forEach(u => {
    qaHtml += `<div style="margin-top:10px;border-top:1px solid #21262d;padding-top:8px">
      <div class="stage-tag">Step ${esc(u.step)}</div>
      <p style="font-size:.9rem;margin-top:4px">🤔 ${esc(u.hook)}</p>
      <p style="font-size:.88rem;color:var(--mut);margin-top:4px">💬 ${esc(u.vernacular)}</p>
      <p style="font-size:.88rem;margin-top:4px">✅ ${esc(u.solution)}</p>
      ${u.teacher ? `<p class="teacher" style="margin-top:4px">👨‍🏫 ${esc(u.teacher)}</p>` : ''}
    </div>`;
  });
  L.innerHTML = `
    <div class="stage-tag">${esc(d.label || 'District Pack')} · ${esc(d.lang||'').toUpperCase()}</div>
    <h1 style="margin:6px 0">${esc(PACK.topic)}</h1>
    ${st.socratic_hook ? `<p style="margin-top:8px;font-size:.95rem">🤔 <b>Sawal:</b> ${esc(st.socratic_hook)}</p>` : ''}
    ${qaHtml}
    ${st.diagram && st.diagram.type ? `<p style="margin-top:8px;color:var(--mut);font-size:.85rem">📐 Diagram: ${esc(st.diagram.type)}</p>` : ''}
    ${st.audio_script ? `<p style="margin-top:8px;color:var(--mut);font-size:.85rem">🔊 Audio script: ${esc(st.audio_script.speaker)} · ${esc(st.audio_script.lang)}</p>` : ''}
    <div class="teacher" id="tline"></div>`;

  // Teacher attribution (sacred)
  let t = '';
  for (const [k,v] of Object.entries(a)) t += `${k}: ${typeof v==='object'?JSON.stringify(v):v}\n`;
  document.getElementById('tline').textContent = '👨‍🏫 TEACHER CREDIT\n' + t.trim();

  // Quiz
  const q = document.getElementById('quiz'); q.classList.remove('hidden');
  const n = (st.micro_quiz && st.micro_quiz.n) || 3;
  let qh = `<div class="stage-tag">Micro Quiz (${n} sawal)</div><div id="qbody"><button onclick="genQuiz(${n})" class="green">Quiz Shuru Karo</button></div>`;
  q.innerHTML = qh;
}

function genQuiz(n){
  const qb = document.getElementById('qbody');
  const bank = (PACK.stages||{}).question_bank || [];
  let h = '';
  if (bank.length) {
    bank.forEach((q, i) => {
      h += `<p style="margin-top:10px;font-size:.9rem">Q${i+1}. ${esc(q.q)}</p>`;
      (q.options||[]).forEach((opt, oi) => {
        h += `<button class="quiz-opt" data-ok="${oi===q.correct_index}" onclick="ans(this,this.dataset.ok==='true')">${esc(opt)}</button>`;
      });
      if (q.why) h += `<p style="font-size:.8rem;color:var(--mut);margin-top:4px" class="whyline hidden">💡 ${esc(q.why)}</p>`;
    });
  } else {
    for (let i=0;i<n;i++){
      h += `<p style="margin-top:10px;font-size:.9rem">Q${i+1}. ${esc(PACK.topic)} — concept ${i+1} ka core kya hai?</p>
        <button class="quiz-opt" onclick="ans(this,false)">Option A</button>
        <button class="quiz-opt right" onclick="ans(this,true)">Concept ${i+1} sahi explanation</button>
        <button class="quiz-opt" onclick="ans(this,false)">Option C</button>`;
    }
  }
  h += `<p id="score" style="margin-top:10px;color:var(--ok)"></p>`;
  qb.innerHTML = h;
}
let __score = 0, __total = 0;
// GURU-SHISHYA MEMORY (canon v2): har attempt yaad — guru shishya ko kabhi nahi bhoolta.
function remember(topic, ok){
  try {
    const log = JSON.parse(localStorage.getItem('air1_attempts') || '[]');
    log.push({t: topic.slice(0,80), ok: ok?1:0, ts: new Date().toISOString()});
    if (log.length > 2000) log.splice(0, log.length - 2000);
    localStorage.setItem('air1_attempts', JSON.stringify(log));
  } catch(e) {}
}
function mySwot(){
  // Guru ka swot view: topic-wise mastery + weak points
  let log = [];
  try { log = JSON.parse(localStorage.getItem('air1_attempts') || '[]'); } catch(e) {}
  const card = document.getElementById('lesson');
  ['quiz','attrib'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('loader').classList.add('hidden');
  card.classList.remove('hidden');
  if (!log.length){
    card.innerHTML = `<div class="stage-tag">Guru Memory</div>
      <p style="margin-top:10px">🧠 Guru ne abhi kuch nahi dekha — pehle reel quiz do, phir yahan tera SWOT dikhega.</p>`;
    return;
  }
  const by = {};
  log.forEach(a => { (by[a.t] = by[a.t] || []).push(a.ok); });
  const rows = Object.entries(by).map(([t, oks]) => ({
    t, n: oks.length, pct: Math.round(100 * oks.filter(Boolean).length / oks.length)
  })).sort((a,b) => a.pct - b.pct);
  // FSRS-lite: next-revision day = last-correct day + interval (1/3/7 by mastery tier)
  const today = new Date().toISOString().slice(0,10);
  const due = {};
  log.forEach(a => { if (a.ok && a.t) { due[a.t] = a.ts.slice(0,10); } });
  const intervalFor = (pct) => pct >= 80 ? 7 : pct >= 50 ? 3 : 1;
  const addDays = (d, n) => new Date(new Date(d).getTime() + n*864e5).toISOString().slice(0,10);
  const strong = rows.filter(r => r.pct >= 70).slice(0,5);
  // POLYMATH INTERCONNECTION: personal weakness x community weakness = top struggle
  const cw = (typeof COMMUNITY_WEAKPOINTS !== "undefined") ? COMMUNITY_WEAKPOINTS : [];
  const struggle = rows.filter(r => r.pct < 70 && cw.some(w =>
    r.t.toLowerCase().includes(w.topic.toLowerCase().split(" ")[0]) ||
    w.topic.toLowerCase().includes(r.t.toLowerCase().split(" ")[0])))[0];
  const weak = rows.filter(r => r.pct < 70).slice(0,8);
  const total = log.length, correct = log.filter(a=>a.ok).length;
  card.innerHTML = `<div class="stage-tag">Guru Memory · SWOT</div>

function exportProgress(){

function ans(btn, ok){
  btn.classList.add(ok?'right':'wrong');
  remember(PACK.topic, ok); // guru memory: har attempt yaad
  // reveal why-line: next sibling, or sibling after option group (why follows last option)
  let el = btn.nextElementSibling;
  while (el) {
    if (el.classList && el.classList.contains('whyline')) { el.classList.remove('hidden'); break; }
    if (el.tagName === 'P' && !el.id) break;
    el = el.nextElementSibling;
  }
  __total++;
  if (ok) { __score++; btn.disabled = true; }
  const s = document.getElementById('score');
  if (s) s.textContent = `Score: ${__score}/${__total} — knowledge har gav tak, ₹0 mein.`;
}

function findMinedClip(topic){
  if (typeof MINED_CLIPS === 'undefined') return null;
  const words = topic.toLowerCase().split(/[^a-z]+/).filter(w => w.length > 4);
  for (const c of MINED_CLIPS){
    const hay = (c.label + ' ' + c.title).toLowerCase();
    if (words.some(w => hay.includes(w))) return c;
  }
  return null;
}

let __reelIdx = -1;

function nextReel(){
  if (typeof AIR1_REELS === 'undefined' || !AIR1_REELS.length) return;
  __reelIdx = (__reelIdx + 1) % AIR1_REELS.length;
  const r = AIR1_REELS[__reelIdx];
  const m = REEL_TEACHER_MAP[r.topic] || {};
  document.getElementById('loader').classList.add('hidden');
  ['lesson','quiz','attrib'].forEach(id => document.getElementById(id).classList.add('hidden'));
  const card = document.getElementById('lesson');
  card.classList.remove('hidden');
  card.innerHTML = `
    <div class="stage-tag">Reel ${__reelIdx+1}/${AIR1_REELS.length} · swipe-free loop</div>
    <h1 style="margin:6px 0;font-size:1.05rem">${esc(r.topic)}</h1>
    <p style="margin-top:8px;font-size:.95rem">🔥 ${esc(r.hook)}</p>
    <p style="margin-top:8px;font-size:.9rem">${esc(r.body)}</p>
    <p style="margin-top:8px;color:#f85149;font-size:.88rem">⚠️ TRAP: ${esc(r.trap)}</p>
    <p style="margin-top:6px;color:var(--ok);font-size:.9rem">🏆 WIN: ${esc(r.win)}</p>
    ${m.teacher ? `<div class="teacher" style="margin-top:10px">👨‍🏫 ${esc(m.teacher)} · 🎬 ${esc(m.ts||'')} 
      ${m.video ? `<a href="${esc(m.video)}" target="_blank" rel="noopener" style="color:var(--acc)">source video</a>` : ''}</div>` : ''}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="startReelQuiz()" class="green" style="flex:1">✅ Quiz do — instant feedback</button>
      <button onclick="nextReel()" style="flex:0;background:#21262d">Next ▶</button>
    </div>`;
}

function startReelQuiz(){
  const r = AIR1_REELS[__reelIdx];
  const m = REEL_TEACHER_MAP[r.topic] || {};
  const q = document.getElementById('quiz');
  q.classList.remove('hidden');
  q.innerHTML = `<div class="stage-tag">Instant Feedback Quiz</div><div id="qbody">
    <p style="margin-top:8px;font-size:.9rem">${esc(r.win.slice(0,80))}... — ye sahi tha ya galat?</p>
    <button class="quiz-opt" onclick="reelAns(this,false,'${esc(r.topic).replace(/'/g,"\\'")}')">Ye galat hai</button>
    <button class="quiz-opt right" data-win="${esc(r.win)}" onclick="reelAns(this,true,'${esc(r.topic).replace(/'/g,"\\'")}')">${esc(r.win)}</button>
    <button class="quiz-opt" onclick="reelAns(this,false)">Dono me se koi nahi</button>
    <p id="score" style="margin-top:10px;color:var(--ok)"></p>
  </div>`;
}

function reelAns(btn, ok, topic){
  btn.classList.add(ok?'right':'wrong');
  remember(topic, ok); // guru memory: reel attempt yaad
  const s = document.getElementById('score');
  if (ok){
    s.textContent = '✅ Sahi! Dopamine unlock — agla reel?';
    const nb = document.createElement('button');
    nb.className = 'green'; nb.style.cssText='width:100%;margin-top:8px';
    nb.textContent = '▶ Agla Reel'; nb.onclick = nextReel;
    s.after(nb);
  } else {
    // STUCK → recommend teacher reel for THIS micro-topic (the canon bridge)
    const m = REEL_TEACHER_MAP[topic] || {};
    const mc = !m.teacher ? findMinedClip(topic) : null;
    s.innerHTML = m.teacher
      ? `🤔 Atak gaye? Koi baat nahi — guru ka reel dekho:<br><b>${esc(m.teacher)}</b> · ${esc(m.ts||'')} 
         ${m.video ? `<a href="${esc(m.video)}" target="_blank" rel="noopener" style="color:var(--acc)">🎬 video kholo</a>` : ''}
         <br>phir wapas aake quiz phir se try karo.`
      : (mc ? `🤔 Atak gaye? Guru ka real clip dekho:<br><b>${esc(mc.teacher)}</b> — ${esc(mc.label)}
         <br><a href="${esc(mc.video)}" target="_blank" rel="noopener" style="color:var(--acc)">🎬 clip kholo</a>
         <br>phir quiz phir se try karo.` : '🤔 Atak gaye? Reel dubara dekho — dhyan se. Phir quiz try karo.');
    const rb = document.createElement('button');
    rb.className='green'; rb.style.cssText='width:100%;margin-top:8px';
    rb.textContent='🔁 Phir se try karo';
    rb.onclick = () => startReelQuiz();
    s.after(rb);
  }
}

  <div class="stage-tag">Voice Input — Apni Boli Me Pucho (Offline)</div>
  <p style="font-size:.8rem;color:var(--mut)">Mic dabao, Hindi/Hinglish me sawal bolo. Sab kuch is device pe.</p>
  <button id="micbtn">🎤 Bolo</button>
  <div class="teacher hidden" id="voiceres"></div>
</div>
<script>
// AIR1 OFFLINE VOICE INPUT V1 (feature-flagged)
// Engine chain: (1) browser SpeechRecognition if available (works offline on some Android),
// (2) POST /asr local endpoint (faster-whisper small int8) when village-server present.
// Mission: bachcha apni boli me puche — no typing barrier. ₹0, offline-first.
(function(){
  const btn = document.getElementById('micbtn');
  const out = document.getElementById('voiceres');
  function show(t){ out.textContent = t; out.classList.remove('hidden'); }
  function handleTranscript(text){
    // match against reel topics -> open closest lesson
    const q = text.toLowerCase();
    let best=null, bestScore=0;
    for(const r of AIR1_REELS){
      const words = r.topic.toLowerCase().split(/\s+/);
      const score = words.filter(w=>w.length>3 && q.includes(w)).length;
      if(score>bestScore){bestScore=score; best=r;}
    }
    if(best && bestScore>0){
      show("✅ Samajh gaya: '"+text+"'\n→ Lesson khul raha hai: "+best.topic);
      document.getElementById('packfile').dispatchEvent(new Event('change'));
      window.dispatchEvent(new CustomEvent('air1-voice-topic',{detail:best}));
    } else {
      show("Sun liya: '"+text+"'\nIs topic par abhi pack me lesson nahi — jaldi aa raha hai.");
    }
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    const rec = new SR(); rec.lang='hi-IN'; rec.interimResults=false;
    btn.onclick=()=>{ try{rec.start(); btn.textContent='🎧 Sun raha hoon...';}catch(e){} };
    rec.onresult=e=>{ btn.textContent='🎤 Bolo'; handleTranscript(e.results[0][0].transcript); };
    rec.onerror=()=>{ btn.textContent='🎤 Bolo'; show("Mic error — dobara try karo."); };
  } else {
    // fallback: village-server local ASR (faster-whisper) — USB pen-drive distribution me bundled
    fetch('/asr/health').then(r=>r.ok?show("Server ASR mode ready"):(()=>{})).catch(()=>{});
    btn.onclick=async()=>{
      btn.textContent='🎧...';
      try{
        const res = await fetch('/asr/listen',{method:'POST'});
        const d = await res.json();
        btn.textContent='🎤 Bolo';
        handleTranscript(d.text||'');
      }catch(e){ btn.textContent='🎤 Bolo'; show("Voice is device par support nahi — teacher se pack file lo."); }
    };
  }
})();
</script>
